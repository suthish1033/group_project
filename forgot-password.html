<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - ResumeAI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 430px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;

            color: #222;

            margin-bottom: 10px;
        }

        .description {
            text-align: center;

            color: #666;

            margin-bottom: 25px;

            line-height: 1.5;
        }

        label {
            display: block;

            margin-top: 15px;

            margin-bottom: 6px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;
        }

        button {
            width: 100%;

            margin-top: 18px;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }
        #sendCodeBtn {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#countdown {
    font-size: 15px;
    font-weight: bold;
    min-width: 45px;
    text-align: right;
}

#sendCodeBtn:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

        button:hover {
            background: #1d4ed8;
        }

        .message {
            margin-top: 15px;

            text-align: center;

            font-size: 14px;
        }

        .back {
            display: block;

            margin-top: 20px;

            text-align: center;

            color: #2563eb;

            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .section {
            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #ddd;
        }
        

    </style>

</head>

<body>

<div class="box">

    <h1>Forgot Password?</h1>

    <p class="description">
        Enter your registered email to receive
        a verification code.
    </p>


    <!-- EMAIL -->

    <div class="section">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
        >

        <button id="sendCodeBtn" onclick="sendCode()">
            <span>Send Verification Code</span>
            <span id="countdown"></span>
        </button>

    </div>


    <!-- OTP -->

    <div class="section">

        <label for="code">
            Verification Code
        </label>

        <input
            type="text"
            id="code"
            placeholder="Enter 6 digit code"
            maxlength="6"
        >

        <button onclick="verifyCode()">
            Verify Code
        </button>

    </div>


    <!-- NEW PASSWORD -->

    <div class="section">

        <label for="newPassword">
            New Password
        </label>

        <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
        >

        <button onclick="resetPassword()">
            Save New Password
        </button>

    </div>


    <p
        id="message"
        class="message"
    ></p>


    <a
        href="index.html"
        class="back"
    >
        ← Back to Login
    </a>

</div>


<script>

const API =
    "http://127.0.0.1:5000";


// SEND CODE

let countdownTimer;

async function sendCode() {

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const button =
        document.getElementById("sendCodeBtn");

    const countdown =
        document.getElementById("countdown");


    // Check email
    if (!email) {

        showMessage(
            "Please enter your email."
        );

        return;
    }


    // Email validation
    const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email)) {

        showMessage(
            "Please enter a valid email address."
        );

        return;
    }


    // Disable button
    button.disabled = true;


    // Start countdown
    let seconds = 60;

    countdown.textContent =
        seconds + "s";


    countdownTimer =
        setInterval(function () {

            seconds--;

            countdown.textContent =
                seconds + "s";


            if (seconds <= 0) {

                clearInterval(
                    countdownTimer
                );

                button.disabled = false;

                countdown.textContent = "";

            }

        }, 1000);


    try {

        const response =
            await fetch(
                API +
                "/api/forgot-password",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        email: email
                    })

                }
            );


        const data =
            await response.json();


        if (response.ok) {

            showMessage(
                "Verification code sent to your email."
            );

        } else {

            showMessage(
                data.message ||
                "Unable to send verification code."
            );

        }


    } catch (error) {

        console.error(error);

        showMessage(
            "Unable to connect to server."
        );

    }

}

// VERIFY CODE

async function verifyCode() {

    const email =
        document
        .getElementById("email")
        .value
        .trim();


    const code =
        document
        .getElementById("code")
        .value
        .trim();


    if (!email || !code) {

        showMessage(
            "Enter email and verification code."
        );

        return;
    }


    try {

        const response =
            await fetch(
                API +
                "/api/verify-code",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        email: email,

                        code: code

                    })

                }
            );


        const data =
            await response.json();


        showMessage(
            data.message
        );


    } catch (error) {

        showMessage(
            "Unable to connect to server."
        );

    }

}


// RESET PASSWORD

async function resetPassword() {

    const email =
        document
        .getElementById("email")
        .value
        .trim();


    const password =
        document
        .getElementById("newPassword")
        .value;


    if (!email || !password) {

        showMessage(
            "Enter email and new password."
        );

        return;
    }


    try {

        const response =
            await fetch(
                API +
                "/api/reset-password",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        email: email,

                        new_password:
                            password

                    })

                }
            );


        const data =
            await response.json();


        showMessage(
            data.message
        );


        if (data.success) {

            setTimeout(
                function() {

                    window.location.href =
                        "index.html";

                },
                1500
            );

        }


    } catch (error) {

        showMessage(
            "Unable to connect to server."
        );

    }

}


// MESSAGE

function showMessage(text) {

    document
        .getElementById("message")
        .textContent = text;

}

</script>

</body>

</html>
